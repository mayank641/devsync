name: DevSync CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/team-collaboration]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Run server tests
        run: npm run test --workspace=server
      - name: Run client tests
        run: npm run test --workspace=client -- --passWithNoTests
